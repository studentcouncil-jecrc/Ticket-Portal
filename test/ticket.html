<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Renaissance Ticket Preview</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>

    @font-face {
      font-family: "Bebas Neue";
      src: url("./assets/fonts/Bebas_Neue/BebasNeue-Regular.ttf");
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #222;
    }


    /* =========================================
       TICKET
       ACTUAL SIZE = 5880 × 2209

       Displayed at 1176 × 441.8
       Scale = 0.2
       ========================================= */

    #ticket {
      width: 1176px;
      height: 441.8px;

      position: relative;

      margin: 50px auto;

      background-image: url("./ticket.png");
      background-size: 100% 100%;
      background-repeat: no-repeat;

      overflow: hidden;
    }


    /* =========================================
       QR CODE

       Backend:

       qrSize = 1600
       qrX = 338
       qrY = (2209 - 1600) / 2
           = 304.5
       ========================================= */

    #qr {
      position: absolute;

      left: calc(338 / 5880 * 100%);
      top: calc(304.5 / 2209 * 100%);

      width: calc(1600 / 5880 * 100%);
      height: calc(1600 / 2209 * 100%);
    }

    #qr canvas {
      display: block;

      width: 100% !important;
      height: 100% !important;
    }


    /* =========================================
       TEXT

       Backend:

       textX = 2660
       ========================================= */

    .text-section {
      position: absolute;

      left: calc(2660 / 5880 * 100%);

      top: 0;

      width: calc(
        (5880 - 2660 - 380) / 5880 * 100%
      );

      height: 100%;
    }


    .text {
      position: absolute;

      font-family: "Bebas Neue", sans-serif;

      color: #000;

      margin: 0;

      white-space: nowrap;
    }


    /* =========================================
       NAME

       Backend:

       font-size max = 180
       displayed = 180 × 0.2 = 36px

       textY = 1000
       ========================================= */

    #name {

      left: 0;

      top: calc(
        1000 / 2209 * 100%
      );

      transform: translateY(-100%);

      font-size: 36px;
    }


    /* =========================================
       YEAR

       Backend:

       nameSize = 180

       textY +=
         round(180 × 1.2) + 10

       = 1000 + 226

       = 1226

       Displayed:
       1226 × 0.2 = 245.2px
       ========================================= */

    #year {

      left: 0;

      top: calc(
        1226 / 2209 * 100%
      );

      transform: translateY(-100%);

      font-size: 30px;
    }


    /* =========================================
       BRANCH

       Backend:

       yearSize = 150

       textY +=
         round(150 × 1.2) + 8

       = 1226 + 188

       = 1414

       Displayed:
       1414 × 0.2 = 282.8px
       ========================================= */

    #branch {

      left: 0;

      top: calc(
        1414 / 2209 * 100%
      );

      transform: translateY(-100%);

      font-size: 30px;
    }

  </style>
</head>


<body>


  <div id="ticket">


    <!-- QR -->

    <div id="qr"></div>


    <!-- TEXT -->

    <div class="text-section">

      <div id="name" class="text">
        PRASHANT SHARMA
      </div>

      <div id="year" class="text">
        3RD YEAR
      </div>

      <div id="branch" class="text">
        COMPUTER SCIENCE
      </div>

    </div>


  </div>


  <script>

    /*
    ============================================================
    ONLY CHANGE THESE
    ============================================================
    */

    const STUDENT_ID = "JECRC12345";

    const STUDENT_NAME = "PRASHANT SHARMA";

    const STUDENT_BRANCH = "COMPUTER SCIENCE";

    const STUDENT_YEAR = 3;


    /*
    ============================================================
    QR PAYLOAD
    ============================================================
    */

    const qrPayload = JSON.stringify({
      mId: STUDENT_ID,
      name: STUDENT_NAME,
      branch: STUDENT_BRANCH,
      year: STUDENT_YEAR
    });


    /*
    ============================================================
    QR
    ============================================================
    */

    new QRCode(
      document.getElementById("qr"),
      {
        text: qrPayload,

        width: 1600,
        height: 1600,

        correctLevel: QRCode.CorrectLevel.H,

        colorDark: "#000000",

        colorLight: "#ffffff"
      }
    );


    /*
    ============================================================
    TEXT
    ============================================================
    */

    document.getElementById("name").textContent =
      STUDENT_NAME.toUpperCase();


    document.getElementById("year").textContent =
      STUDENT_YEAR === 1
        ? "1ST YEAR"
        : STUDENT_YEAR === 2
        ? "2ND YEAR"
        : STUDENT_YEAR === 3
        ? "3RD YEAR"
        : `${STUDENT_YEAR}TH YEAR`;


    document.getElementById("branch").textContent =
      STUDENT_BRANCH.toUpperCase();

  </script>

</body>
</html>
