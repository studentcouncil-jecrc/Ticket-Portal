<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Renaissance Ticket Preview</title>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merienda&display=swap"
    rel="stylesheet"
  />

  <!-- QR Code Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      font-family: Arial, sans-serif;
    }

    .wrapper {
      width: 100%;
      max-width: 1200px;
    }

    /* =========================
       TICKET
    ========================= */

    .ticket {
      position: relative;

      width: 100%;
      aspect-ratio: 5880 / 2209;

      background-image: url("./ticket.png");
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;

      overflow: hidden;
    }


    /* =========================
       QR CODE
    ========================= */

    .qr-container {
      position: absolute;

      /*
        Canvas:
        qrX = 338
        qrY = (2209 - 1600) / 2
        qrSize = 1600
      */

      left: calc(338 / 5880 * 100%);
      top: calc(304.5 / 2209 * 100%);

      width: calc(1600 / 5880 * 100%);
      height: calc(1600 / 2209 * 100%);

      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode {
      width: 100%;
      height: 100%;
    }

    #qrcode img,
    #qrcode canvas {
      width: 100% !important;
      height: 100% !important;
    }


    /* =========================
       TEXT
    ========================= */

    .text-section {
      position: absolute;

      /*
        Canvas:
        textX = 2660
      */

      left: calc(2660 / 5880 * 100%);

      /*
        Canvas:
        textY = 1000
        Canvas uses baseline positioning,
        so this is approximate in HTML.
      */

      top: calc(850 / 2209 * 100%);

      width: calc(2840 / 5880 * 100%);

      color: #223041;
    }


    .ticket-text {
      font-family: "Bebas Neue", sans-serif;

      margin: 0;

      line-height: 1.1;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: clip;
    }


    .name {
      font-size: clamp(30px, 3.05vw, 180px);
      margin-bottom: 20px;
    }


    .year {
      font-size: clamp(25px, 2.55vw, 150px);
      margin-bottom: 15px;
    }


    .branch {
      font-size: clamp(25px, 2.55vw, 150px);
    }


    /* =========================
       CONTROLS
    ========================= */

    .controls {
      margin-top: 25px;

      background: white;

      padding: 20px;

      border-radius: 10px;
    }

    .controls h2 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 10px;

      font-size: 16px;

      border: 1px solid #ccc;
      border-radius: 5px;
    }


    button {
      padding: 10px 20px;

      border: none;

      border-radius: 5px;

      cursor: pointer;

      font-size: 16px;
    }

  </style>
</head>


<body>

  <div class="wrapper">

    <!-- =========================
         TICKET
    ========================== -->

    <div class="ticket">

      <!-- QR -->
      <div class="qr-container">
        <div id="qrcode"></div>
      </div>


      <!-- TEXT -->
      <div class="text-section">

        <p
          id="nameText"
          class="ticket-text name"
        >
          NAME: PRASHANT SHARMA
        </p>


        <p
          id="yearText"
          class="ticket-text year"
        >
          YEAR: 2
        </p>


        <p
          id="branchText"
          class="ticket-text branch"
        >
          BRANCH: CSE
        </p>

      </div>

    </div>


    <!-- =========================
         CONTROLS
    ========================== -->

    <div class="controls">

      <h2>Ticket Preview Controls</h2>


      <div class="field">

        <label>
          Name
        </label>

        <input
          id="nameInput"
          type="text"
          value="Prashant Sharma"
        />

      </div>


      <div class="field">

        <label>
          Year
        </label>

        <input
          id="yearInput"
          type="text"
          value="2"
        />

      </div>


      <div class="field">

        <label>
          Branch
        </label>

        <input
          id="branchInput"
          type="text"
          value="CSE"
        />

      </div>


      <div class="field">

        <label>
          QR Data
        </label>

        <input
          id="qrInput"
          type="text"
          value='{"studentMongoId":"123456","name":"Prashant Sharma","branch":"CSE","year":2}'
        />

      </div>

    </div>

  </div>


  <script>

    // ==========================================
    // ELEMENTS
    // ==========================================

    const nameInput =
      document.getElementById("nameInput");

    const yearInput =
      document.getElementById("yearInput");

    const branchInput =
      document.getElementById("branchInput");

    const qrInput =
      document.getElementById("qrInput");


    const nameText =
      document.getElementById("nameText");

    const yearText =
      document.getElementById("yearText");

    const branchText =
      document.getElementById("branchText");


    const qrContainer =
      document.getElementById("qrcode");


    // ==========================================
    // GENERATE QR
    // ==========================================

    function generateQR() {

      qrContainer.innerHTML = "";

      new QRCode(qrContainer, {
        text: qrInput.value,

        width: 1600,
        height: 1600,

        correctLevel:
          QRCode.CorrectLevel.H
      });

    }


    // ==========================================
    // UPDATE TEXT
    // ==========================================

    function updateTicket() {

      const name =
        nameInput.value.trim();

      const year =
        yearInput.value.trim();

      const branch =
        branchInput.value.trim();


      nameText.textContent =
        `NAME: ${name.toUpperCase()}`;


      yearText.textContent =
        `YEAR: ${year}`;


      branchText.textContent =
        `BRANCH: ${branch.toUpperCase()}`;


      generateQR();
    }


    // ==========================================
    // LIVE UPDATE
    // ==========================================

    nameInput.addEventListener(
      "input",
      updateTicket
    );

    yearInput.addEventListener(
      "input",
      updateTicket
    );

    branchInput.addEventListener(
      "input",
      updateTicket
    );

    qrInput.addEventListener(
      "input",
      generateQR
    );


    // Initial QR
    generateQR();

  </script>

</body>
</html>
